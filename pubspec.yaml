name: ren_tracker
description: Ren Tracker - Renish Electronics Attendance App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.4
  google_sign_in: ^6.2.1

  # OneSignal Push Notifications
  onesignal_flutter: ^5.2.8

  # UI
  fl_chart: ^0.66.2

  # Utils
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  csv: ^6.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  google_sign_in_android: 6.2.1
  google_sign_in_platform_interface: 2.5.0
  path_provider_android: 2.2.23
  shared_preferences_android: 2.4.25

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1e3a8a"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
